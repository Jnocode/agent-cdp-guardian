[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-cdp-guardian"
version = "0.1.0"
description = "A fail-closed, privacy-preserving CDP security proxy & SDK for autonomous AI coding agents (Codex CLI, Hermes, OpenClaw)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Jnocode", email = "jnocode@users.noreply.github.com" }
]
keywords = [
    "cdp",
    "chrome-devtools-protocol",
    "ai-agents",
    "security",
    "privacy",
    "browser-automation",
    "fail-closed",
    "codex",
    "hermes",
    "openclaw"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]

[project.urls]
Homepage = "https://github.com/Jnocode/agent-cdp-guardian"
Documentation = "https://github.com/Jnocode/agent-cdp-guardian#readme"
Repository = "https://github.com/Jnocode/agent-cdp-guardian.git"
Issues = "https://github.com/Jnocode/agent-cdp-guardian/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_cdp_guardian*"]
